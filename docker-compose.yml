services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dashboard}
      MYSQL_USER: ${MYSQL_USER:-dashboard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dashboard}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dashboard-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_DSN: ${DATABASE_DSN:-dashboard:dashboard@tcp(mysql:3306)/dashboard?charset=utf8mb4&parseTime=True&loc=Local}
      EXPORTER_URL: ${EXPORTER_URL:-http://exporter:3000}
      FRONTEND_RENDER_URL: ${FRONTEND_RENDER_URL:-http://frontend}
      DATASOURCE_ENCRYPTION_KEY: ${DATASOURCE_ENCRYPTION_KEY:-please-change-this-in-production}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-30}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:-10000}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-5242880}
      PORT: 18085
    ports:
      - "18085:18085"
    depends_on:
      mysql:
        condition: service_healthy

  exporter:
    build: ./exporter
    restart: unless-stopped
    environment:
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - frontend

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
